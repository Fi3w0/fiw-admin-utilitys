plugins {
    id 'java'
    id 'net.neoforged.moddev.legacyforge'
}

def targetProperties = new Properties()
file('gradle.properties').withInputStream { targetProperties.load(it) }
targetProperties.each { key, value -> project.ext.set(key.toString(), value) }

evaluationDependsOn(':core')

base {
    archivesName = "${project.archives_base_name}-forge-${project.minecraft_version}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(project.java_version as int)
    }

    withSourcesJar()
}

sourceSets {
    main {
        java.srcDir rootProject.file('common-1.20.1/src/main/java')
    }
}

repositories {
    mavenCentral()
}

legacyForge {
    version = "${project.minecraft_version}-${project.forge_version}"
    runs {
        client { client() }
        server { server() }
    }
    mods {
        fiw_admin_tools {
            sourceSet sourceSets.main
            sourceSet project(':core').sourceSets.main
        }
    }
}

dependencies {
    implementation project(':core')
}

tasks.withType(JavaCompile).configureEach {
    options.release = project.java_version as int
    options.encoding = 'UTF-8'
}

tasks.named('processResources', ProcessResources).configure {
    def properties = [
            version                : project.version,
            neoforge_mod_id        : project.neoforge_mod_id,
            mod_name               : project.mod_name,
            mod_description        : project.mod_description,
            mod_license            : project.mod_license,
            mod_author             : project.mod_author,
            minecraft_version_range: project.minecraft_version_range,
            loader_version_range   : project.loader_version_range
    ]

    inputs.properties(properties)

    filesMatching('META-INF/mods.toml') {
        expand properties
    }
}

jar {
    from project(':core').sourceSets.main.output
    manifest {
        attributes 'MixinConfigs': 'fiw_admin_tools.mixins.json'
    }
}

// Forge 1.20.1 runs SRG names; the Mixin AP must remap string-based selectors too.
dependencies { annotationProcessor 'org.spongepowered:mixin:0.8.5:processor' }
mixin {
    add sourceSets.main, 'fiw_admin_tools.refmap.json'
    config 'fiw_admin_tools.mixins.json'
}
