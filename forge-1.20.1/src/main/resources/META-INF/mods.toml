modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/Fi3w0/fiw-admin-utilitys/issues"

[[mods]]
modId = "${neoforge_mod_id}"
version = "${version}"
displayName = "${mod_name}"
description = '''${mod_description}'''
authors = "${mod_author}"
logoFile = "assets/fiw-admin-tools/icon.png"
logoBlur = false
displayURL = "https://modrinth.com/mod/fiw-admin-utilitys"
displayTest = "IGNORE_SERVER_VERSION"

[[dependencies.${neoforge_mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${loader_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${neoforge_mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
