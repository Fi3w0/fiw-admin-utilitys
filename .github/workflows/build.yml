name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17, 21, and 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
            25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build all eight targets and run core tests
        run: ./gradlew build --stacktrace
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}

      - name: Upload built jars
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fiw-admin-tools-jars
          path: '**/build/libs/*.jar'
          if-no-files-found: error

      - name: Read mod version
        id: version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          VERSION="$(awk -F= '$1 == "mod_version" { print $2 }' gradle.properties)"
          if [ -z "$VERSION" ]; then
            echo "mod_version not found in gradle.properties" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check release tag
        id: release_tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git tag --list "$TAG" | grep -qx "$TAG"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$TAG already exists; skipping publish"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Modrinth secret
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.release_tag.outputs.exists == 'false'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_API_KEY }}
        run: |
          if [ -z "$MODRINTH_TOKEN" ]; then
            echo "MODRINTH_API_KEY is required to publish a new version" >&2
            exit 1
          fi

      - name: Collect release jars
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.release_tag.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p release
          jars=(
            "fabric-1.21.11/build/libs/fiw-admin-tools-fabric-1.21.11-$VERSION.jar"
            "neoforge-1.21.11/build/libs/fiw-admin-tools-neoforge-1.21.11-$VERSION.jar"
            "fabric-1.21.8/build/libs/fiw-admin-tools-fabric-1.21.8-$VERSION.jar"
            "neoforge-1.21.8/build/libs/fiw-admin-tools-neoforge-1.21.8-$VERSION.jar"
            "fabric-1.21.1/build/libs/fiw-admin-tools-fabric-1.21.1-$VERSION.jar"
            "neoforge-1.21.1/build/libs/fiw-admin-tools-neoforge-1.21.1-$VERSION.jar"
            "fabric-1.20.1/build/libs/fiw-admin-tools-fabric-1.20.1-$VERSION.jar"
            "forge-1.20.1/build/libs/fiw-admin-tools-forge-1.20.1-$VERSION.jar"
          )
          for jar in "${jars[@]}"; do
            test -f "$jar"
            cp -v "$jar" release/
          done
          test "$(find release -name '*.jar' | wc -l)" -eq 8
          ls -la release

      - name: Extract release notes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.release_tag.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk -v ver="$VERSION" '
            /^## \[/ { if (p) exit; if ($0 ~ ("^## \\[" ver "\\]")) p=1 }
            p { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Fiw Admin Tools $VERSION" > RELEASE_NOTES.md
          fi

      - name: Create release tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.release_tag.outputs.exists == 'false'
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git config user.name "Fi3w0"
          git config user.email "fi3w0@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.release_tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          gh release create "$TAG" release/*.jar \
            --title "Fiw Admin Tools $VERSION" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag \
            --latest

      - name: Publish Modrinth versions and sync description
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.release_tag.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_API_KEY }}
        run: bash .github/scripts/publish-modrinth.sh
